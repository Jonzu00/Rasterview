[package]
name = "rasterview"
version = "1.0.0"
edition = "2021"
description = "RasterView - a classic, fast, native photo viewer"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
image = { version = "0.25.5", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico", "tga"] }
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# keep panic = "unwind" (default): decoder panics are caught and shown as errors
